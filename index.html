<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IPTV Tesla EXTREME</title>
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { 
    width: 100%; 
    height: 100%; 
    overflow: hidden;
    background: #111;
  }

  body {
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* CONTENEDOR EMULADOR - EFECTO TESLA */
  .emulator-wrapper {
    position: relative;
    width: 90%;
    max-width: 1280px;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 20px;
    box-shadow: 0 0 80px rgba(76, 175, 80, 0.3),
                inset 0 0 40px rgba(0, 0, 0, 0.8);
    border: 3px solid #1a1a1a;
    overflow: hidden;
    animation: emulatorGlow 3s ease-in-out infinite;
  }

  @keyframes emulatorGlow {
    0%, 100% { box-shadow: 0 0 80px rgba(76, 175, 80, 0.3),
                           inset 0 0 40px rgba(0, 0, 0, 0.8); }
    50% { box-shadow: 0 0 100px rgba(76, 175, 80, 0.5),
                      inset 0 0 40px rgba(0, 0, 0, 0.8); }
  }

  .emulator-content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* PANTALLA DE VIDEO */
  #videoContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 1;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* INTERFAZ DE CONTROL FLOTANTE */
  .control-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
    z-index: 100;
  }

  .header {
    background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
    padding: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
    backdrop-filter: blur(10px);
  }

  .channel-info {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.9);
  }

  .status-group {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    background: rgba(0,0,0,0.4);
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid rgba(76, 175, 80, 0.3);
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #4CAF50;
    box-shadow: 0 0 8px #4CAF50;
    animation: pulse 1.5s infinite;
  }

  .status-dot.error {
    background: #f44336;
    box-shadow: 0 0 8px #f44336;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .footer {
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 100%);
    padding: 24px;
    display: flex;
    gap: 12px;
    pointer-events: auto;
    justify-content: center;
    flex-wrap: wrap;
    backdrop-filter: blur(10px);
  }

  .btn {
    background: rgba(76, 175, 80, 0.1);
    border: 2px solid rgba(76, 175, 80, 0.4);
    color: #fff;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-width: 110px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn:hover {
    background: rgba(76, 175, 80, 0.25);
    border-color: rgba(76, 175, 80, 0.7);
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(76, 175, 80, 0.2);
  }

  .btn:active {
    background: rgba(76, 175, 80, 0.35);
    transform: translateY(0);
  }

  .channel-selector {
    position: absolute;
    bottom: 100px;
    left: 20px;
    right: 20px;
    background: rgba(0,0,0,0.95);
    border: 2px solid rgba(76, 175, 80, 0.5);
    border-radius: 12px;
    max-height: 200px;
    overflow-y: auto;
    pointer-events: auto;
    display: none;
    z-index: 50;
    backdrop-filter: blur(15px);
  }

  .channel-selector.show {
    display: block;
    animation: slideUp 0.3s ease-out;
  }

  @keyframes slideUp {
    from { 
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .channel-item {
    padding: 16px 20px;
    border-bottom: 1px solid #222;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .channel-item:hover {
    background: rgba(76, 175, 80, 0.15);
    padding-left: 24px;
  }

  .channel-item.active {
    background: rgba(76, 175, 80, 0.3);
    border-left: 4px solid #4CAF50;
    font-weight: bold;
    color: #4CAF50;
    padding-left: 16px;
  }

  .channel-number {
    min-width: 30px;
    font-weight: bold;
    color: #4CAF50;
  }

  .error-msg {
    position: absolute;
    top: 100px;
    left: 20px;
    background: rgba(244, 67, 54, 0.95);
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 14px;
    max-width: 300px;
    z-index: 300;
    display: none;
    border-left: 4px solid #f44336;
    backdrop-filter: blur(10px);
  }

  .error-msg.show {
    display: block;
    animation: slideIn 0.3s;
  }

  @keyframes slideIn {
    from { transform: translateX(-100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .debug-log {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(0, 0, 0, 0.9);
    color: #0f0;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 12px;
    border-radius: 6px;
    max-width: 280px;
    max-height: 140px;
    overflow-y: auto;
    z-index: 200;
    display: none;
    border: 1px solid #0f0;
  }

  .debug-log.show {
    display: block;
  }

  .debug-log div {
    margin: 3px 0;
    line-height: 1.3;
  }

  /* RESPONSIVO */
  @media (max-width: 768px) {
    .emulator-wrapper {
      width: 95%;
      border-radius: 12px;
    }

    .channel-info {
      font-size: 24px;
    }

    .btn {
      padding: 12px 20px;
      font-size: 14px;
    }

    .header, .footer {
      padding: 16px;
    }
  }
</style>
</head>
<body>

<div class="emulator-wrapper">
  <div class="emulator-content">
    <div id="videoContainer">
      <video id="video" playsinline muted autoplay crossorigin="anonymous"></video>
    </div>

    <div class="control-bar">
      <div class="header">
        <div class="channel-info" id="channelName">TESLA IPTV</div>
        <div class="status-group">
          <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <div id="statusText">Listo</div>
          </div>
        </div>
      </div>

      <div class="footer">
        <button class="btn" id="playBtn">▶ PLAY</button>
        <button class="btn" id="pauseBtn">⏸ PAUSA</button>
        <button class="btn" id="muteBtn">🔊 SONIDO</button>
        <button class="btn" id="channelsBtn">📡 CANALES</button>
      </div>
    </div>

    <div class="channel-selector" id="channelSelector"></div>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<div class="debug-log" id="debugLog"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
(function() {
  const video = document.getElementById('video');
  const channelName = document.getElementById('channelName');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const muteBtn = document.getElementById('muteBtn');
  const channelsBtn = document.getElementById('channelsBtn');
  const channelSelector = document.getElementById('channelSelector');
  const errorMsg = document.getElementById('errorMsg');
  const debugLog = document.getElementById('debugLog');

  let debugMessages = [];

  function debug(msg) {
    const timestamp = new Date().toLocaleTimeString();
    debugMessages.push(`[${timestamp}] ${msg}`);
    if (debugMessages.length > 15) debugMessages.shift();
    debugLog.innerHTML = debugMessages.map(m => `<div>${m}</div>`).join('');
  }

  function showError(msg, duration = 5000) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    debug(`❌ ${msg}`);
    setTimeout(() => errorMsg.classList.remove('show'), duration);
  }

  function updateStatus(text, isError = false) {
    statusText.textContent = text;
    statusDot.classList.toggle('error', isError);
  }

  // CANALES
  const channels = [
    { name: 'Bufalo 5', url: 'https://bufaloweb.com/httpsCON/bufalo5/index.m3u8' },
    { name: 'RTVE 24H', url: 'https://rtvelivestream.akamaized.net/rtvesec/24h/24h_main_dvr.m3u8' }
  ];

  let currentIndex = 0;
  let hls = null;
  let isPlaying = false;

  const HLS_CONFIG = {
    debug: false,
    autoStartLoad: true,
    startLevel: -1,
    maxBufferLength: 60,
    maxMaxBufferLength: 120,
    fragLoadingMaxRetry: 10,
    fragLoadingTimeOut: 30000,
    manifestLoadingMaxRetry: 10,
    manifestLoadingTimeOut: 30000,
  };

  function renderChannels() {
    channelSelector.innerHTML = '';
    channels.forEach((ch, i) => {
      const div = document.createElement('div');
      div.className = `channel-item ${i === currentIndex ? 'active' : ''}`;
      div.innerHTML = `<span class="channel-number">${i + 1}</span><span>${ch.name}</span>`;
      div.onclick = () => {
        currentIndex = i;
        playChannel(i);
        channelSelector.classList.remove('show');
      };
      channelSelector.appendChild(div);
    });
  }

  function setupHLS(url) {
    if (hls) hls.destroy();

    const isNativeHLS = video.canPlayType('application/vnd.apple.mpegurl');

    if (isNativeHLS) {
      video.src = url;
      updateStatus('Cargado');
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls(HLS_CONFIG);
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        updateStatus('Cargado');
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          updateStatus('Error', true);
          showError('Error en stream');
        }
      });
    }
  }

  function playChannel(index) {
    currentIndex = index;
    const channel = channels[index];
    channelName.textContent = channel.name;
    updateStatus('Cargando...');
    setupHLS(channel.url);
    renderChannels();
  }

  // ==================== CONTROL SIMPLE Y LIMPIO ====================

  // Solo reanudar si se pausa accidentalmente
  video.addEventListener('pause', () => {
    if (isPlaying && video.src) {
      debug(`🔄 Reanudando...`);
      video.play().catch(() => {});
    }
  }, true);

  // BOTONES
  playBtn.onclick = () => {
    isPlaying = true;
    video.muted = false;
    muteBtn.textContent = '🔊 SONIDO ON';
    updateStatus('🎬 REPRODUCIENDO');

    const playPromise = video.play();
    if (playPromise) {
      playPromise.then(() => {
        debug(`✅ Playback iniciado`);
      }).catch(e => {
        updateStatus('Error', true);
        showError(`Error: ${e.message}`);
      });
    }
  };

  pauseBtn.onclick = () => {
    isPlaying = false;
    video.pause();
    updateStatus('Pausado');
  };

  muteBtn.onclick = () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇 SILENCIO' : '🔊 SONIDO';
  };

  channelsBtn.onclick = () => {
    channelSelector.classList.toggle('show');
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'd' || e.key === 'D') {
      debugLog.classList.toggle('show');
    }
  });

  // INIT
  debug('🚀 IPTV TESLA EXTREME - CLEAN MODE');
  renderChannels();
  playChannel(0);
  updateStatus('Listo - Presiona PLAY');
})();
</script>
</body>
</html>

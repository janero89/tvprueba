<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IPTV Tesla — Flotante</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0b0d10;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* Fondo de ejemplo detrás del reproductor, solo para mostrar que
     la ventana flota por encima de cualquier contenido de la página */
  .backdrop {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #3a4048;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 0;
    padding: 20px;
    text-align: center;
  }

  /* ---------- Ventana flotante ---------- */
  #floatWin {
    position: fixed;
    top: 60px;
    right: 24px;
    width: 420px;
    height: 260px;
    min-width: 260px;
    min-height: 160px;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    touch-action: none;
  }

  #floatWin.dragging, #floatWin.resizing { transition: none; }
  #floatWin.minimized { height: 44px !important; }
  #floatWin.minimized .stage { display: none; }

  .win-bar {
    height: 32px;
    flex-shrink: 0;
    background: #16191d;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    cursor: grab;
    user-select: none;
    border-bottom: 1px solid #23282f;
  }
  .win-bar:active { cursor: grabbing; }

  .win-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #cfd3d9;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .win-btn {
    width: 22px; height: 22px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: #9aa1ab;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .win-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .win-btn.close:hover { background: #f44336; color: #fff; }

  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #000;
  }

  #video {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  #canvas { display: block; width: 100%; height: 100%; background: #000; }

  .control-bar {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
    z-index: 100;
  }

  .header {
    background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, transparent 100%);
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
  }

  .channel-info { font-size: 14px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }

  .status { display: flex; align-items: center; gap: 6px; font-size: 10px; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4CAF50; box-shadow: 0 0 6px #4CAF50;
    animation: pulse 1.5s infinite;
  }
  .status-dot.error { background: #f44336; box-shadow: 0 0 6px #f44336; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  .footer {
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 100%);
    padding: 8px;
    display: flex;
    gap: 6px;
    pointer-events: auto;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    min-width: 0;
    text-align: center;
  }
  .btn:hover { background: rgba(255,255,255,0.25); }
  .btn:active { background: rgba(255,255,255,0.35); }
  .btn.play { background: #4CAF50; border-color: #4CAF50; }
  .btn.play:hover { background: #66BB6A; }
  .btn.pause { background: #FF9800; border-color: #FF9800; }
  .btn.pause:hover { background: #FFB74D; }
  .btn.mute { background: #2196F3; border-color: #2196F3; }
  .btn.mute:hover { background: #42A5F5; }
  .btn.fs { background: #009688; border-color: #009688; }
  .btn.fs:hover { background: #26A69A; }
  .btn.channels { background: #673AB7; border-color: #673AB7; }
  .btn.channels:hover { background: #7E57C2; }

  .channel-selector {
    position: absolute;
    bottom: 46px;
    left: 0; right: 0;
    background: rgba(0,0,0,0.97);
    border-top: 2px solid #4CAF50;
    max-height: 120px;
    overflow-y: auto;
    pointer-events: auto;
    display: none;
    z-index: 50;
  }
  .channel-selector.show { display: block; }
  .channel-item { padding: 10px 14px; border-bottom: 1px solid #222; cursor: pointer; font-size: 12px; }
  .channel-item:hover { background: rgba(76, 175, 80, 0.2); }
  .channel-item.active {
    background: rgba(76, 175, 80, 0.4);
    border-left: 4px solid #4CAF50;
    padding-left: 10px;
    font-weight: bold;
  }

  .error-msg {
    position: absolute;
    top: 38px; left: 10px; right: 10px;
    background: rgba(244, 67, 54, 0.92);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 11px;
    z-index: 300;
    display: none;
  }
  .error-msg.show { display: block; }

  .reconnecting {
    position: absolute;
    bottom: 46px; right: 10px;
    background: rgba(255, 152, 0, 0.92);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    z-index: 300;
    display: none;
  }
  .reconnecting.show { display: block; animation: pulse 1s infinite; }

  /* Manija de redimensionar, esquina inferior derecha */
  .resize-handle {
    position: absolute;
    bottom: 0; right: 0;
    width: 18px; height: 18px;
    cursor: nwse-resize;
    z-index: 200;
    background:
      linear-gradient(135deg, transparent 0 50%, rgba(255,255,255,0.35) 50% 60%, transparent 60% 70%, rgba(255,255,255,0.35) 70% 80%, transparent 80% 100%);
  }
  #floatWin.minimized .resize-handle { display: none; }
</style>
</head>
<body>

<div class="backdrop">Contenido de fondo de la página — el reproductor flota por encima, en cualquier posición</div>

<div id="floatWin">
  <div class="win-bar" id="winBar">
    <span class="win-title" id="channelName">IPTV</span>
    <button class="win-btn" id="minBtn" title="Minimizar">—</button>
    <button class="win-btn close" id="closeBtn" title="Cerrar">✕</button>
  </div>

  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>

    <div class="control-bar">
      <div class="header">
        <div class="status">
          <div class="status-dot" id="statusDot"></div>
          <div id="statusText">Listo</div>
        </div>
      </div>

      <div class="footer">
        <button class="btn play" id="playBtn">▶</button>
        <button class="btn pause" id="pauseBtn">⏸</button>
        <button class="btn mute" id="muteBtn">🔊</button>
        <button class="btn fs" id="fsBtn">⛶</button>
        <button class="btn channels" id="channelsBtn">📻</button>
      </div>
    </div>

    <div class="channel-selector" id="channelSelector"></div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="reconnecting" id="reconnecting">Reconectando...</div>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
(function() {
  const floatWin = document.getElementById('floatWin');
  const winBar = document.getElementById('winBar');
  const minBtn = document.getElementById('minBtn');
  const closeBtn = document.getElementById('closeBtn');
  const resizeHandle = document.getElementById('resizeHandle');

  const stage = document.getElementById('stage');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const channelName = document.getElementById('channelName');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const muteBtn = document.getElementById('muteBtn');
  const fsBtn = document.getElementById('fsBtn');
  const channelsBtn = document.getElementById('channelsBtn');
  const channelSelector = document.getElementById('channelSelector');
  const errorMsg = document.getElementById('errorMsg');
  const reconnecting = document.getElementById('reconnecting');

  let audioOnlyMode = false;
  let drawing = false;

  // LISTA FIJA DE CANALES
  const channels = [
    { name: 'Bufalo 5', url: 'https://bufaloweb.com/httpsCON/bufalo5/index.m3u8' },
    { name: 'RTVE 24H', url: 'https://rtvelivestream.akamaized.net/rtvesec/24h/24h_main_dvr.m3u8' }
  ];

  let currentIndex = 0;
  let hls = null;
  let reconnectAttempts = 0;
  const MAX_RECONNECT = 5;
  let reconnectTimeout = null;

  const HLS_CONFIG = {
    debug: false,
    autoStartLoad: true,
    startLevel: -1,
    maxBufferLength: 60,
    maxMaxBufferLength: 120,
    maxBufferSize: 60 * 1000 * 1000,
    maxLoadingDelay: 4,
    minAutoBitrate: 0,
    lowLatencyMode: false,
    enableWorker: true,
    workerPath: 'https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.worker.min.js',
    fragLoadingMaxRetry: 10,
    fragLoadingTimeOut: 30000,
    manifestLoadingMaxRetry: 10,
    manifestLoadingTimeOut: 30000,
    progressive: true,
  };

  // ---------- Arrastrar la ventana ----------
  let dragOffsetX = 0, dragOffsetY = 0, dragging = false;

  winBar.addEventListener('pointerdown', (e) => {
    if (e.target !== winBar && e.target.className !== 'win-title') return;
    dragging = true;
    floatWin.classList.add('dragging');
    const rect = floatWin.getBoundingClientRect();
    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;
    winBar.setPointerCapture(e.pointerId);
  });

  winBar.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    let x = e.clientX - dragOffsetX;
    let y = e.clientY - dragOffsetY;
    x = Math.max(0, Math.min(window.innerWidth - 60, x));
    y = Math.max(0, Math.min(window.innerHeight - 40, y));
    floatWin.style.left = x + 'px';
    floatWin.style.top = y + 'px';
    floatWin.style.right = 'auto';
  });

  function stopDrag(e) {
    if (!dragging) return;
    dragging = false;
    floatWin.classList.remove('dragging');
  }
  winBar.addEventListener('pointerup', stopDrag);
  winBar.addEventListener('pointercancel', stopDrag);

  // ---------- Redimensionar la ventana ----------
  let resizing = false, resizeStartX = 0, resizeStartY = 0, resizeStartW = 0, resizeStartH = 0;

  resizeHandle.addEventListener('pointerdown', (e) => {
    resizing = true;
    floatWin.classList.add('resizing');
    resizeStartX = e.clientX;
    resizeStartY = e.clientY;
    const rect = floatWin.getBoundingClientRect();
    resizeStartW = rect.width;
    resizeStartH = rect.height;
    resizeHandle.setPointerCapture(e.pointerId);
  });

  resizeHandle.addEventListener('pointermove', (e) => {
    if (!resizing) return;
    const w = Math.max(260, resizeStartW + (e.clientX - resizeStartX));
    const h = Math.max(160, resizeStartH + (e.clientY - resizeStartY));
    floatWin.style.width = w + 'px';
    floatWin.style.height = h + 'px';
    resizeCanvas();
  });

  function stopResize() {
    if (!resizing) return;
    resizing = false;
    floatWin.classList.remove('resizing');
  }
  resizeHandle.addEventListener('pointerup', stopResize);
  resizeHandle.addEventListener('pointercancel', stopResize);

  // ---------- Minimizar / cerrar ----------
  minBtn.onclick = () => floatWin.classList.toggle('minimized');
  closeBtn.onclick = () => { floatWin.style.display = 'none'; video.pause(); stopDrawing(); };

  // ---------- Canvas render loop ----------
  function resizeCanvas() {
    canvas.width = stage.clientWidth;
    canvas.height = stage.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('fullscreenchange', resizeCanvas);
  document.addEventListener('webkitfullscreenchange', resizeCanvas);
  resizeCanvas();

  function drawFrame() {
    if (!drawing) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const cw = canvas.width, ch = canvas.height;
      const vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.min(cw / vw, ch / vh);
      const dw = vw * scale, dh = vh * scale;
      const dx = (cw - dw) / 2, dy = (ch - dh) / 2;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(video, dx, dy, dw, dh);
    }
    requestAnimationFrame(drawFrame);
  }

  function startDrawing() {
    if (drawing) return;
    drawing = true;
    requestAnimationFrame(drawFrame);
  }
  function stopDrawing() { drawing = false; }

  // ---------- Helpers ----------
  function showError(msg, duration = 5000) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    setTimeout(() => errorMsg.classList.remove('show'), duration);
  }

  function updateStatus(text, isError = false) {
    statusText.textContent = text;
    statusDot.classList.toggle('error', isError);
  }

  function renderChannels() {
    channelSelector.innerHTML = '';
    channels.forEach((ch, i) => {
      const div = document.createElement('div');
      div.className = `channel-item ${i === currentIndex ? 'active' : ''}`;
      div.textContent = `${i + 1}. ${ch.name}`;
      div.onclick = () => {
        currentIndex = i;
        playChannel(i);
        channelSelector.classList.remove('show');
      };
      channelSelector.appendChild(div);
    });
  }

  function setupHLS(url) {
    if (hls) hls.destroy();
    stopDrawing();

    const isNativeHLS = video.canPlayType('application/vnd.apple.mpegurl');

    if (isNativeHLS) {
      video.src = url;
      updateStatus('Cargado');
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls(HLS_CONFIG);
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => updateStatus('Cargado'));

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              updateStatus('Error red', true);
              showError('Problema de conexión. Reconectando...');
              attemptReconnect();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              updateStatus('Error codec', true);
              showError('Codec no soportado. Intenta otro canal.');
              break;
            default:
              updateStatus('Error', true);
              showError('Error desconocido');
              break;
          }
        }
      });

      hls.on(Hls.Events.BUFFER_APPENDING, () => { reconnectAttempts = 0; });
    } else {
      showError('HLS no soportado');
      updateStatus('Error', true);
    }
  }

  function playChannel(index) {
    const channel = channels[index];
    currentIndex = index;
    channelName.textContent = channel.name;
    updateStatus('Cargando...');
    reconnectAttempts = 0;
    setupHLS(channel.url);
    renderChannels();
  }

  function attemptReconnect() {
    if (reconnectAttempts >= MAX_RECONNECT) {
      updateStatus('Reconexión fallida', true);
      showError('No se puede reconectar. Intenta otro canal.');
      return;
    }
    reconnectAttempts++;
    reconnecting.classList.add('show');
    updateStatus('Reconectando...');
    clearTimeout(reconnectTimeout);
    reconnectTimeout = setTimeout(() => {
      playChannel(currentIndex);
      reconnecting.classList.remove('show');
    }, 3000 * reconnectAttempts);
  }

  // ---------- Sistema antipausa ----------
  function forceContinuePlayback() {
    if (video.paused && !audioOnlyMode && floatWin.style.display !== 'none') {
      video.muted = false;
      video.play().then(startDrawing).catch(() => {});
    }
  }

  function antiPauseLoop() {
    forceContinuePlayback();
    requestAnimationFrame(antiPauseLoop);
  }

  setInterval(() => { forceContinuePlayback(); }, 500);

  // ---------- Controls ----------
  playBtn.onclick = () => {
    video.muted = false;
    muteBtn.textContent = '🔊';
    antiPauseLoop();

    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        updateStatus('Reproduciendo ▶');
        resizeCanvas();
        startDrawing();
      }).catch(() => {
        updateStatus('Error', true);
        showError('Error de reproducción');
      });
    }
  };

  pauseBtn.onclick = () => {
    video.pause();
    stopDrawing();
    updateStatus('Pausado');
  };

  muteBtn.onclick = () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇' : '🔊';
    updateStatus(video.muted ? 'Silencio' : 'Sonido ON');
  };

  // Fullscreen sobre #stage (canvas + controles), incluso estando flotante
  fsBtn.onclick = () => {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs) {
      if (stage.requestFullscreen) stage.requestFullscreen();
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
      else showError('Este navegador no soporta pantalla completa.');
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  };

  channelsBtn.onclick = () => channelSelector.classList.toggle('show');

  video.addEventListener('playing', () => {
    updateStatus('Reproduciendo ▶');
    startDrawing();
  });

  video.addEventListener('pause', () => {
    if (!audioOnlyMode && video.src && floatWin.style.display !== 'none') {
      setTimeout(() => {
        video.muted = false;
        video.play().then(startDrawing).catch(() => {});
      }, 100);
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !video.paused && video.src) {
      video.play().then(startDrawing).catch(() => {});
    }
  });

  window.addEventListener('online', () => updateStatus('Conectado'));
  window.addEventListener('offline', () => updateStatus('Sin conexión', true));

  video.controls = false;

  // Inicializar
  renderChannels();
  playChannel(0);
  updateStatus('Listo - Toca ▶');
})();
</script>
</body>
</html>

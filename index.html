<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IPTV Tesla ULTIMATE - BYPASS</title>
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  #mainContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 1;
  }

  /* VIDEO PRINCIPAL */
  #video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* CANVAS LAYER - Para renderizar manualmente */
  #canvasRenderer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    display: none;
  }

  /* WEBGL LAYER - Para renderización alternativa */
  #webglCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    display: none;
  }

  /* IFRAME OCULTO - Reproducir en segundo plano */
  #hiddenFrame {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 1px;
    height: 1px;
    z-index: -1;
  }

  /* UI CONTROLS */
  .control-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
    z-index: 100;
  }

  .header {
    background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
  }

  .channel-info {
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: #fff;
  }

  .status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #4CAF50;
    box-shadow: 0 0 8px #4CAF50;
    animation: pulse 1.5s infinite;
  }

  .status-dot.error {
    background: #f44336;
    box-shadow: 0 0 8px #f44336;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .footer {
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.95) 100%);
    padding: 20px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 110px;
  }

  .btn:hover {
    background: rgba(255,255,255,0.25);
    border-color: rgba(255,255,255,0.5);
  }

  .btn.play { background: #4CAF50; border-color: #4CAF50; }
  .btn.pause { background: #FF9800; border-color: #FF9800; }
  .btn.canvas { background: #2196F3; border-color: #2196F3; }
  .btn.channels { background: #673AB7; border-color: #673AB7; }

  .channel-selector {
    position: fixed;
    bottom: 100px;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.97);
    border-top: 3px solid #4CAF50;
    max-height: 250px;
    overflow-y: auto;
    pointer-events: auto;
    display: none;
    z-index: 50;
  }

  .channel-selector.show {
    display: block;
  }

  .channel-item {
    padding: 18px 24px;
    border-bottom: 1px solid #222;
    cursor: pointer;
    font-size: 18px;
    color: #fff;
    transition: background 0.2s;
  }

  .channel-item:hover {
    background: rgba(76, 175, 80, 0.2);
  }

  .channel-item.active {
    background: rgba(76, 175, 80, 0.4);
    border-left: 5px solid #4CAF50;
    font-weight: bold;
  }

  .debug-log {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.9);
    color: #0f0;
    font-family: monospace;
    font-size: 11px;
    padding: 10px;
    border-radius: 4px;
    max-width: 300px;
    max-height: 150px;
    overflow-y: auto;
    z-index: 200;
    display: none;
    border: 1px solid #0f0;
  }

  .debug-log.show {
    display: block;
  }

  .debug-log div {
    margin: 2px 0;
  }

  .warning {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 193, 7, 0.95);
    color: #000;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    z-index: 500;
    display: none;
    max-width: 400px;
  }

  .warning.show {
    display: block;
  }
</style>
</head>
<body>

<div id="mainContainer">
  <video id="video" playsinline muted crossorigin="anonymous" style="display: none;"></video>
  <canvas id="canvasRenderer"></canvas>
  <canvas id="webglCanvas"></canvas>
  <iframe id="hiddenFrame" src="about:blank"></iframe>
</div>

<div class="control-bar">
  <div class="header">
    <div class="channel-info" id="channelName">🚗 TESLA ULTIMATE</div>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <div id="statusText">Inicializando...</div>
    </div>
  </div>

  <div class="footer">
    <button class="btn play" id="playBtn">▶ PLAY</button>
    <button class="btn pause" id="pauseBtn">⏸ PAUSA</button>
    <button class="btn canvas" id="canvasBtn">🎨 CANVAS</button>
    <button class="btn channels" id="channelsBtn">📻 CANALES</button>
  </button>
</div>

<div class="channel-selector" id="channelSelector"></div>
<div class="debug-log" id="debugLog"></div>
<div class="warning" id="warning"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
(function() {
  const video = document.getElementById('video');
  const canvasRenderer = document.getElementById('canvasRenderer');
  const ctxCanvas = canvasRenderer.getContext('2d');
  const webglCanvas = document.getElementById('webglCanvas');
  const ctxWebGL = webglCanvas.getContext('webgl2') || webglCanvas.getContext('webgl');
  const channelName = document.getElementById('channelName');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const canvasBtn = document.getElementById('canvasBtn');
  const channelsBtn = document.getElementById('channelsBtn');
  const channelSelector = document.getElementById('channelSelector');
  const debugLog = document.getElementById('debugLog');
  const warning = document.getElementById('warning');

  let debugMessages = [];
  let isPlaying = false;
  let useCanvasRenderer = false;
  let useWebGLRenderer = false;
  let hls = null;
  let currentIndex = 0;

  // CANALES
  const channels = [
    { name: 'Bufalo 5', url: 'https://bufaloweb.com/httpsCON/bufalo5/index.m3u8' },
    { name: 'RTVE 24H', url: 'https://rtvelivestream.akamaized.net/rtvesec/24h/24h_main_dvr.m3u8' }
  ];

  function debug(msg) {
    const timestamp = new Date().toLocaleTimeString();
    debugMessages.push(`[${timestamp}] ${msg}`);
    if (debugMessages.length > 25) debugMessages.shift();
    debugLog.innerHTML = debugMessages.map(m => `<div>${m}</div>`).join('');
  }

  function updateStatus(text, isError = false) {
    statusText.textContent = text;
    statusDot.classList.toggle('error', isError);
    debug(`📊 ${text}`);
  }

  // ==================== MÉTODO 1: VIDEO HTML5 FORZADO ====================
  function setupVideoElement(url) {
    video.src = url;
    video.muted = false;
    video.volume = 1;
    video.style.display = 'block';
    updateStatus('Video HTML5 cargado');
    debug('✅ Método 1: HTML5 Video activado');
  }

  // ==================== MÉTODO 2: CANVAS RENDERER ====================
  function setupCanvasRenderer(url) {
    useCanvasRenderer = true;
    canvasRenderer.style.display = 'block';

    // Crear video en el background
    const bgVideo = document.createElement('video');
    bgVideo.src = url;
    bgVideo.muted = false;
    bgVideo.volume = 1;
    bgVideo.crossOrigin = 'anonymous';
    bgVideo.style.display = 'none';
    document.body.appendChild(bgVideo);

    function renderFrame() {
      try {
        if (!bgVideo.paused && bgVideo.currentTime > 0) {
          canvasRenderer.width = window.innerWidth;
          canvasRenderer.height = window.innerHeight;
          ctxCanvas.drawImage(bgVideo, 0, 0, canvasRenderer.width, canvasRenderer.height);
        }
        if (useCanvasRenderer) requestAnimationFrame(renderFrame);
      } catch (e) {
        debug(`❌ Canvas Error: ${e.message}`);
      }
    }

    bgVideo.play().then(() => {
      updateStatus('Canvas Renderer activo');
      debug('✅ Método 2: Canvas Renderer activado');
      renderFrame();
    }).catch(e => {
      debug(`⚠️ Canvas play error: ${e.message}`);
      updateStatus('Error Canvas', true);
    });

    return bgVideo;
  }

  // ==================== MÉTODO 3: WEBGL RENDERER ====================
  function setupWebGLRenderer(url) {
    useWebGLRenderer = true;
    webglCanvas.style.display = 'block';

    const bgVideo = document.createElement('video');
    bgVideo.src = url;
    bgVideo.muted = false;
    bgVideo.volume = 1;
    bgVideo.crossOrigin = 'anonymous';
    bgVideo.style.display = 'none';
    document.body.appendChild(bgVideo);

    if (!ctxWebGL) {
      debug('⚠️ WebGL no soportado');
      return null;
    }

    const vertexShader = `
      attribute vec4 position;
      varying vec2 texCoord;
      void main() {
        gl_Position = position;
        texCoord = (position.xy + 1.0) / 2.0;
      }
    `;

    const fragmentShader = `
      precision mediump float;
      uniform sampler2D u_texture;
      varying vec2 texCoord;
      void main() {
        gl_FragColor = texture2D(u_texture, texCoord);
      }
    `;

    function compileShader(source, type) {
      const shader = ctxWebGL.createShader(type);
      ctxWebGL.shaderSource(shader, source);
      ctxWebGL.compileShader(shader);
      return shader;
    }

    const program = ctxWebGL.createProgram();
    ctxWebGL.attachShader(program, compileShader(vertexShader, ctxWebGL.VERTEX_SHADER));
    ctxWebGL.attachShader(program, compileShader(fragmentShader, ctxWebGL.FRAGMENT_SHADER));
    ctxWebGL.linkProgram(program);
    ctxWebGL.useProgram(program);

    function renderWebGL() {
      try {
        if (!bgVideo.paused && bgVideo.currentTime > 0) {
          webglCanvas.width = window.innerWidth;
          webglCanvas.height = window.innerHeight;

          const texture = ctxWebGL.createTexture();
          ctxWebGL.bindTexture(ctxWebGL.TEXTURE_2D, texture);
          ctxWebGL.texImage2D(ctxWebGL.TEXTURE_2D, 0, ctxWebGL.RGBA, ctxWebGL.RGBA, ctxWebGL.UNSIGNED_BYTE, bgVideo);

          ctxWebGL.drawArrays(ctxWebGL.TRIANGLE_STRIP, 0, 4);
        }
        if (useWebGLRenderer) requestAnimationFrame(renderWebGL);
      } catch (e) {
        debug(`❌ WebGL Error: ${e.message}`);
      }
    }

    bgVideo.play().then(() => {
      updateStatus('WebGL Renderer activo');
      debug('✅ Método 3: WebGL Renderer activado');
      renderWebGL();
    }).catch(e => {
      debug(`⚠️ WebGL play error: ${e.message}`);
      updateStatus('Error WebGL', true);
    });

    return bgVideo;
  }

  // ==================== MÉTODO 4: DETECCIÓN DE RESTRICCIONES ====================
  function detectAndBypass() {
    debug('🔍 Detectando restricciones de Tesla...');

    // Intentar detectar si estamos en un Tesla
    const isTesla = /Tesla|Tesla Browser|Tesla Model|EVMobi|X11|Linux ARM/.test(navigator.userAgent);
    const isMoving = navigator.geolocation ? '?' : 'N/A';

    debug(`🚗 ¿Tesla detectado?: ${isTesla}`);
    debug(`📍 ¿En movimiento?: ${isMoving}`);

    // Intentar request fullscreen agresivamente
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }

    // Intentar Picture in Picture
    if (video.requestPictureInPicture) {
      video.requestPictureInPicture().catch(() => {});
    }

    // Solicitar permisos de presentación
    if (navigator.presentation && navigator.presentation.request) {
      navigator.presentation.request(['presentation/html5']).catch(() => {});
    }
  }

  // ==================== ANTI-PAUSE ULTRA AGRESIVO ====================
  function masterAntiPauseLoop() {
    if (!isPlaying) return;

    // Forzar reproducción en video
    if (video.src && video.paused) {
      video.muted = false;
      video.play().catch(() => {});
    }

    // Forzar reproducción en canvas video
    const canvasVideos = document.querySelectorAll('video[style*="display: none"]');
    canvasVideos.forEach(v => {
      if (v.paused) {
        v.muted = false;
        v.play().catch(() => {});
      }
    });

    // Evitar que se ponga en fullscreen accidentalmente
    if (document.fullscreenElement === null && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }

    // Reintento agresivo
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        if (video.src) video.play().catch(() => {});
        if (canvasVideos.length > 0) {
          canvasVideos[0].muted = false;
          canvasVideos[0].play().catch(() => {});
        }
      }, i * 50);
    }

    requestAnimationFrame(masterAntiPauseLoop);
  }

  // ==================== INTERVALOS DE SEGURIDAD ====================
  setInterval(() => {
    if (isPlaying) {
      // Asegurar volumen
      if (video.src) {
        video.muted = false;
        video.volume = 1;
      }

      // Asegurar que no está pausado
      const allVideos = document.querySelectorAll('video');
      allVideos.forEach(v => {
        if (v.paused && v.src) {
          v.play().catch(() => {});
        }
      });

      debug('🔄 Control de seguridad ejecutado');
    }
  }, 200);

  // ==================== EVENTOS ====================
  video.addEventListener('pause', () => {
    if (isPlaying) {
      debug('⚠️ PAUSE detectado - Reintentando...');
      setTimeout(() => {
        video.muted = false;
        video.play().catch(() => {});
      }, 100);
    }
  }, true);

  // ==================== BOTONES ====================
  playBtn.onclick = () => {
    isPlaying = true;
    detectAndBypass();

    const channel = channels[currentIndex];
    setupVideoElement(channel.url);

    video.muted = false;
    video.play().then(() => {
      updateStatus('🎬 REPRODUCIENDO - MÉTODO HTML5');
      masterAntiPauseLoop();
      debug('✅ Reproducción iniciada');
    }).catch(e => {
      debug(`❌ Error HTML5: ${e.message}`);
      updateStatus('Intentando Canvas...', true);

      // Fallback a Canvas
      setTimeout(() => {
        setupCanvasRenderer(channel.url);
      }, 500);
    });
  };

  pauseBtn.onclick = () => {
    isPlaying = false;
    video.pause();
    useCanvasRenderer = false;
    useWebGLRenderer = false;
    canvasRenderer.style.display = 'none';
    webglCanvas.style.display = 'none';
    updateStatus('⏸ Pausado');
  };

  canvasBtn.onclick = () => {
    if (isPlaying) {
      const channel = channels[currentIndex];
      useCanvasRenderer = !useCanvasRenderer;

      if (useCanvasRenderer) {
        canvasRenderer.style.display = 'block';
        setupCanvasRenderer(channel.url);
      } else {
        canvasRenderer.style.display = 'none';
      }
    }
  };

  channelsBtn.onclick = () => {
    channelSelector.classList.toggle('show');
  };

  // Render canales
  function renderChannels() {
    channelSelector.innerHTML = '';
    channels.forEach((ch, i) => {
      const div = document.createElement('div');
      div.className = `channel-item ${i === currentIndex ? 'active' : ''}`;
      div.textContent = `${i + 1}. ${ch.name}`;
      div.onclick = () => {
        currentIndex = i;
        channelName.textContent = ch.name;
        channelSelector.classList.remove('show');
        if (isPlaying) {
          playBtn.click();
        }
      };
      channelSelector.appendChild(div);
    });
  }

  // Toggle debug
  document.addEventListener('keydown', (e) => {
    if (e.key === 'd' || e.key === 'D') {
      debugLog.classList.toggle('show');
    }
  });

  // Inicializar
  renderChannels();
  updateStatus('Listo - Presiona PLAY');
  debug('🚀 Sistema ULTIMATE iniciado');
  debug('Presiona "D" para ver debug log');
  debug('Métodos activos: HTML5, Canvas, WebGL, Fullscreen, PiP');
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IPTV Tesla — Canvas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body {
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
  }

  /* El <video> real nunca se muestra: es solo la fuente decodificada */
  #video {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
  }

  /* En fullscreen, el navegador centra el elemento pero no siempre
     respeta el aspect-ratio del contenido -> lo controlamos nosotros
     dibujando con letterboxing dentro del propio canvas. */
  #stage:fullscreen #canvas,
  #stage:-webkit-full-screen #canvas {
    width: 100vw;
    height: 100vh;
  }

  .control-bar {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
    z-index: 100;
  }

  .header {
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
  }

  .channel-info { font-size: 24px; font-weight: bold; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }

  .status { display: flex; align-items: center; gap: 12px; font-size: 14px; }

  .status-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #4CAF50; box-shadow: 0 0 8px #4CAF50;
    animation: pulse 1.5s infinite;
  }
  .status-dot.error { background: #f44336; box-shadow: 0 0 8px #f44336; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  .footer {
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.8) 100%);
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    pointer-events: auto;
    justify-content: center;
  }

  .btn {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    min-width: 100px;
    text-align: center;
  }
  .btn:hover { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); }
  .btn:active { background: rgba(255,255,255,0.35); }
  .btn.play { background: #4CAF50; border-color: #4CAF50; }
  .btn.play:hover { background: #66BB6A; }
  .btn.pause { background: #FF9800; border-color: #FF9800; }
  .btn.pause:hover { background: #FFB74D; }
  .btn.mute { background: #2196F3; border-color: #2196F3; }
  .btn.mute:hover { background: #42A5F5; }
  .btn.fs { background: #009688; border-color: #009688; }
  .btn.fs:hover { background: #26A69A; }

  .channel-selector {
    position: absolute;
    bottom: 80px; left: 0; right: 0;
    background: rgba(0,0,0,0.95);
    border-top: 2px solid #333;
    max-height: 200px;
    overflow-y: auto;
    pointer-events: auto;
    display: none;
    z-index: 50;
  }
  .channel-selector.show { display: block; }
  .channel-item { padding: 16px 20px; border-bottom: 1px solid #222; cursor: pointer; font-size: 18px; }
  .channel-item:hover { background: rgba(76, 175, 80, 0.2); }
  .channel-item.active { background: rgba(76, 175, 80, 0.4); border-left: 4px solid #4CAF50; padding-left: 16px; }

  .load-panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.95);
    padding: 40px;
    border-radius: 12px;
    text-align: center;
    z-index: 200;
    pointer-events: auto;
    min-width: 400px;
    display: none;
  }
  .load-panel h2 { margin-bottom: 20px; font-size: 24px; }
  .load-panel input {
    width: 100%; padding: 14px; margin-bottom: 16px;
    border: 1px solid #555; background: #111; color: #fff;
    border-radius: 6px; font-size: 16px;
  }
  .load-panel input:focus { outline: none; border-color: #4CAF50; }
  .load-panel button {
    width: 100%; padding: 14px; background: #4CAF50; border: none;
    color: #fff; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
  }
  .load-panel button:hover { background: #66BB6A; }
  .load-panel .or { margin: 20px 0; color: #888; }
  .file-input-label {
    display: block; padding: 14px; background: #222;
    border: 2px dashed #555; border-radius: 6px; cursor: pointer; margin-bottom: 16px;
  }
  .file-input-label:hover { border-color: #4CAF50; }

  .error-msg {
    position: fixed; top: 20px; left: 20px;
    background: rgba(244, 67, 54, 0.9);
    padding: 16px 20px; border-radius: 6px;
    font-size: 14px; max-width: 400px; z-index: 300; display: none;
  }
  .error-msg.show { display: block; animation: slideIn 0.3s; }
  @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .reconnecting {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(255, 152, 0, 0.9);
    padding: 16px 20px; border-radius: 6px;
    font-size: 14px; z-index: 300; display: none;
  }
  .reconnecting.show { display: block; animation: pulse 1s infinite; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>

  <div class="control-bar">
    <div class="header">
      <div class="channel-info" id="channelName">Seleccionar canal</div>
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <div id="statusText">Esperando...</div>
      </div>
    </div>

    <div class="footer">
      <button class="btn play" id="playBtn">▶ REPRODUCIR</button>
      <button class="btn pause" id="pauseBtn">⏸ PAUSAR</button>
      <button class="btn mute" id="muteBtn">🔊 SONIDO ON</button>
      <button class="btn fs" id="fsBtn">⛶ PANTALLA COMPLETA</button>
      <button class="btn" id="channelsBtn" style="background:#673AB7; border-color:#673AB7;">📻 CANALES</button>
      <button class="btn" id="loadBtn" style="background:#FF5722; border-color:#FF5722;">📂 CARGAR</button>
    </div>
  </div>

  <div class="channel-selector" id="channelSelector"></div>

  <div class="load-panel" id="loadPanel">
    <h2>Cargar Stream IPTV</h2>
    <label style="font-size:12px;color:#888;display:block;margin-bottom:8px;text-align:left;">
      Opción 1: URL de Stream Directo (M3U8/HLS)
    </label>
    <input type="text" id="streamUrl" placeholder="https://ejemplo.com/stream.m3u8">
    <button id="loadStreamBtn">▶ Reproducir Stream</button>

    <div class="or">— O —</div>

    <label style="font-size:12px;color:#888;display:block;margin-bottom:8px;text-align:left;">
      Opción 2: URL de Lista M3U/M3U8
    </label>
    <input type="text" id="m3uUrl" placeholder="https://ejemplo.com/lista.m3u8">
    <button id="loadUrlBtn">Cargar Lista</button>

    <div class="or">— O —</div>

    <label class="file-input-label" for="m3uFile">Haz clic o arrastra archivo .m3u</label>
    <input type="file" id="m3uFile" accept=".m3u,.m3u8,text/plain" style="display:none">
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="reconnecting" id="reconnecting">Reconectando...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
(function() {
  const stage = document.getElementById('stage');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const channelName = document.getElementById('channelName');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const muteBtn = document.getElementById('muteBtn');
  const fsBtn = document.getElementById('fsBtn');
  const channelsBtn = document.getElementById('channelsBtn');
  const loadBtn = document.getElementById('loadBtn');
  const channelSelector = document.getElementById('channelSelector');
  const loadPanel = document.getElementById('loadPanel');
  const streamUrl = document.getElementById('streamUrl');
  const loadStreamBtn = document.getElementById('loadStreamBtn');
  const m3uUrl = document.getElementById('m3uUrl');
  const loadUrlBtn = document.getElementById('loadUrlBtn');
  const m3uFile = document.getElementById('m3uFile');
  const errorMsg = document.getElementById('errorMsg');
  const reconnecting = document.getElementById('reconnecting');

  let channels = [];
  let currentIndex = -1;
  let hls = null;
  let reconnectAttempts = 0;
  const MAX_RECONNECT = 5;
  let reconnectTimeout = null;
  let drawing = false;

  const DEFAULT_CHANNEL_URL = 'https://bufaloweb.com/httpsCON/bufalo3/index.m3u8';

  const HLS_CONFIG = {
    debug: false,
    autoStartLoad: true,
    startLevel: -1,
    maxBufferLength: 60,
    maxMaxBufferLength: 120,
    maxBufferSize: 60 * 1000 * 1000,
    maxLoadingDelay: 4,
    minAutoBitrate: 0,
    lowLatencyMode: false,
    enableWorker: true,
    workerPath: 'https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.worker.min.js',
    fragLoadingMaxRetry: 10,
    fragLoadingTimeOut: 30000,
    manifestLoadingMaxRetry: 10,
    manifestLoadingTimeOut: 30000,
    progressive: true,
    testBandwidth: false,
    nudgeOffset: 0.1,
    abrBandwidthFactor: 0.95,
    abrBandwidthSafetyFactor: 0.9,
  };

  // ---------- Canvas render loop ----------
  function resizeCanvas() {
    canvas.width = stage.clientWidth;
    canvas.height = stage.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('fullscreenchange', resizeCanvas);
  document.addEventListener('webkitfullscreenchange', resizeCanvas);
  resizeCanvas();

  function drawFrame() {
    if (!drawing) return;
    if (video.readyState >= 2 && video.videoWidth) {
      // Letterboxing manual: mantiene el aspect ratio del vídeo dentro del canvas
      const cw = canvas.width, ch = canvas.height;
      const vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.min(cw / vw, ch / vh);
      const dw = vw * scale, dh = vh * scale;
      const dx = (cw - dw) / 2, dy = (ch - dh) / 2;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(video, dx, dy, dw, dh);
    }
    requestAnimationFrame(drawFrame);
  }

  function startDrawing() {
    if (drawing) return;
    drawing = true;
    requestAnimationFrame(drawFrame);
  }

  function stopDrawing() {
    drawing = false;
  }

  // ---------- Helpers ----------
  function showError(msg, duration = 5000) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    setTimeout(() => errorMsg.classList.remove('show'), duration);
  }

  function updateStatus(text, isError = false) {
    statusText.textContent = text;
    statusDot.classList.toggle('error', isError);
  }

  function parseM3U(content) {
    const lines = content.split('\n');
    const result = [];
    let current = null;

    for (let raw of lines) {
      const line = raw.trim();
      if (!line) continue;

      if (line.startsWith('#EXTINF')) {
        const nameMatch = line.split(',');
        const name = nameMatch.length > 1 ? nameMatch.slice(1).join(',').trim() : 'Canal';
        const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
        const groupMatch = line.match(/group-title="([^"]*)"/i);
        current = { name: name || 'Canal', logo: logoMatch ? logoMatch[1] : '', group: groupMatch ? groupMatch[1] : '' };
      } else if (!line.startsWith('#') && current) {
        result.push({ name: current.name, url: line, logo: current.logo, group: current.group });
        current = null;
      } else if (!line.startsWith('#') && !current) {
        result.push({ name: `Canal ${result.length + 1}`, url: line, logo: '', group: '' });
      }
    }
    return result;
  }

  function renderChannels() {
    channelSelector.innerHTML = '';
    channels.forEach((ch, i) => {
      const div = document.createElement('div');
      div.className = `channel-item ${i === currentIndex ? 'active' : ''}`;
      div.textContent = `${i + 1}. ${ch.name}`;
      div.onclick = () => {
        currentIndex = i;
        playChannel(i);
        channelSelector.classList.remove('show');
      };
      channelSelector.appendChild(div);
    });
  }

  function setupHLS(url) {
    if (hls) hls.destroy();
    stopDrawing();

    const isNativeHLS = video.canPlayType('application/vnd.apple.mpegurl');

    if (isNativeHLS) {
      video.src = url;
      updateStatus('Cargado - Toca REPRODUCIR');
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls(HLS_CONFIG);
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        updateStatus('Cargado - Toca REPRODUCIR');
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        console.error('HLS Error:', data);
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              updateStatus('Error de red - reconectando...', true);
              showError('Problema de conectividad. Reconectando...');
              attemptReconnect();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              updateStatus('Error de media', true);
              showError('Codec incompatible con este dispositivo. Intenta otro canal.');
              setTimeout(() => hls.recoverMediaError(), 1000);
              break;
            default:
              updateStatus('Error fatal', true);
              showError('Error desconocido: ' + (data.details || data.type));
              break;
          }
        }
      });

      hls.on(Hls.Events.BUFFER_APPENDING, () => { reconnectAttempts = 0; });
    } else {
      showError('Navegador no soporta HLS');
      updateStatus('Sin soporte HLS', true);
    }
  }

  function playChannel(index) {
    if (index < 0 || index >= channels.length) return;
    const channel = channels[index];
    currentIndex = index;
    channelName.textContent = channel.name;
    updateStatus('Cargando...');
    reconnectAttempts = 0;
    setupHLS(channel.url);
    renderChannels();
  }

  function attemptReconnect() {
    if (reconnectAttempts >= MAX_RECONNECT) {
      updateStatus('Reconexión fallida', true);
      showError('No se puede reconectar. Intenta con otro canal.');
      return;
    }
    reconnectAttempts++;
    reconnecting.classList.add('show');
    updateStatus(`Reconectando... (${reconnectAttempts}/${MAX_RECONNECT})`);
    clearTimeout(reconnectTimeout);
    reconnectTimeout = setTimeout(() => {
      if (currentIndex >= 0) playChannel(currentIndex);
      reconnecting.classList.remove('show');
    }, 3000 * reconnectAttempts);
  }

  // ---------- Controls ----------
  playBtn.onclick = () => {
    video.muted = false;
    muteBtn.textContent = '🔊 SONIDO ON';

    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        updateStatus('Reproduciendo');
        resizeCanvas();
        startDrawing();
      }).catch(e => {
        console.warn('Play error:', e);
        updateStatus('Error al reproducir', true);
        let msg = 'Error: ' + (e.name || 'Desconocido');
        if (e.name === 'NotSupportedError') msg = 'Codec no soportado. Intenta otro canal o lista.';
        else if (e.name === 'NotAllowedError') msg = 'Reproducción bloqueada. Intenta hacer clic nuevamente.';
        else if (e.name === 'AbortError') msg = 'Reproducción cancelada. Intenta nuevamente.';
        showError(msg);
      });
    }
  };

  pauseBtn.onclick = () => {
    video.pause();
    stopDrawing();
    updateStatus('Pausado');
  };

  muteBtn.onclick = () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇 SONIDO OFF' : '🔊 SONIDO ON';
    updateStatus(video.muted ? 'Sonido desactivado' : 'Sonido activado');
  };

  // Fullscreen sobre el <div id="stage"> (contiene el canvas + los controles)
  fsBtn.onclick = () => {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs) {
      if (stage.requestFullscreen) stage.requestFullscreen();
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
      else showError('Este navegador no soporta pantalla completa.');
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  };

  channelsBtn.onclick = () => channelSelector.classList.toggle('show');
  loadBtn.onclick = () => { loadPanel.style.display = loadPanel.style.display === 'none' || !loadPanel.style.display ? 'block' : 'none'; };

  loadStreamBtn.onclick = async () => {
    const url = streamUrl.value.trim();
    if (!url) return;
    loadStreamBtn.textContent = '⏳ Cargando...';
    try {
      channels = [{ name: 'Stream Directo', url: url, logo: '', group: 'Directo' }];
      currentIndex = 0;
      channelName.textContent = 'Stream Directo';
      updateStatus('Cargando stream...');
      reconnectAttempts = 0;
      setupHLS(url);
      loadPanel.style.display = 'none';
      renderChannels();
      showError('Stream cargado. Haz clic en ▶ REPRODUCIR', 3000);
    } catch (e) {
      showError(`Error: ${e.message}`);
      updateStatus('Error cargando stream', true);
    } finally {
      loadStreamBtn.textContent = '▶ Reproducir Stream';
    }
  };

  loadUrlBtn.onclick = async () => {
    const url = m3uUrl.value.trim();
    if (!url) return;
    loadUrlBtn.textContent = 'Cargando...';
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      channels = parseM3U(text);
      renderChannels();
      loadPanel.style.display = 'none';
      updateStatus(`${channels.length} canales cargados`);
      if (channels.length > 0) playChannel(0);
    } catch (e) {
      showError(`Error: ${e.message}`);
      updateStatus('Error cargando lista', true);
    } finally {
      loadUrlBtn.textContent = 'Cargar desde URL';
    }
  };

  m3uFile.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      channels = parseM3U(ev.target.result);
      renderChannels();
      loadPanel.style.display = 'none';
      updateStatus(`${channels.length} canales cargados`);
      if (channels.length > 0) playChannel(0);
    };
    reader.readAsText(file);
  };

  document.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; };
  document.ondrop = (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && (file.name.endsWith('.m3u') || file.name.endsWith('.m3u8'))) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        channels = parseM3U(ev.target.result);
        renderChannels();
        loadPanel.style.display = 'none';
        updateStatus(`${channels.length} canales cargados`);
        if (channels.length > 0) playChannel(0);
      };
      reader.readAsText(file);
    }
  };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !video.paused && video.src) {
      video.play().then(startDrawing).catch(e => console.warn('Resume error:', e));
    }
  });

  window.addEventListener('online', () => {
    updateStatus('Conectado');
    if (currentIndex >= 0 && !video.src) playChannel(currentIndex);
  });
  window.addEventListener('offline', () => updateStatus('Sin conexión', true));

  video.controls = false;
  updateStatus('Listo');

  // ---------- Canal por defecto ----------
  channels = [{ name: 'Canal 3', url: DEFAULT_CHANNEL_URL, logo: '', group: 'Directo' }];
  currentIndex = 0;
  channelName.textContent = 'Canal 3';
  renderChannels();
  playChannel(0);
})();
</script>
</body>
</html>

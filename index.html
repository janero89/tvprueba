<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IPTV Tesla — Canvas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body {
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
  }

  /* El <video> real nunca se muestra: solo decodifica el stream */
  #video {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
  }

  #stage:fullscreen #canvas,
  #stage:-webkit-full-screen #canvas {
    width: 100vw;
    height: 100vh;
  }

  .control-bar {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
    z-index: 100;
  }

  .header {
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
  }

  .channel-info { font-size: 28px; font-weight: bold; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }

  .status { display: flex; align-items: center; gap: 12px; font-size: 14px; }

  .status-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #4CAF50; box-shadow: 0 0 8px #4CAF50;
    animation: pulse 1.5s infinite;
  }
  .status-dot.error { background: #f44336; box-shadow: 0 0 8px #f44336; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  .footer {
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.9) 100%);
    padding: 20px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    min-width: 110px;
    text-align: center;
  }
  .btn:hover { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); }
  .btn:active { background: rgba(255,255,255,0.35); }
  .btn.play { background: #4CAF50; border-color: #4CAF50; font-size: 18px; }
  .btn.play:hover { background: #66BB6A; }
  .btn.pause { background: #FF9800; border-color: #FF9800; }
  .btn.pause:hover { background: #FFB74D; }
  .btn.mute { background: #2196F3; border-color: #2196F3; }
  .btn.mute:hover { background: #42A5F5; }
  .btn.fs { background: #009688; border-color: #009688; }
  .btn.fs:hover { background: #26A69A; }
  .btn.channels { background: #673AB7; border-color: #673AB7; }
  .btn.channels:hover { background: #7E57C2; }

  .channel-selector {
    position: absolute;
    bottom: 100px;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.97);
    border-top: 3px solid #4CAF50;
    max-height: 250px;
    overflow-y: auto;
    pointer-events: auto;
    display: none;
    z-index: 50;
  }
  .channel-selector.show { display: block; }
  .channel-item { padding: 18px 24px; border-bottom: 1px solid #222; cursor: pointer; font-size: 18px; }
  .channel-item:hover { background: rgba(76, 175, 80, 0.2); }
  .channel-item.active {
    background: rgba(76, 175, 80, 0.4);
    border-left: 5px solid #4CAF50;
    padding-left: 19px;
    font-weight: bold;
  }

  .error-msg {
    position: fixed; top: 20px; left: 20px;
    background: rgba(244, 67, 54, 0.9);
    padding: 16px 20px; border-radius: 6px;
    font-size: 14px; max-width: 400px; z-index: 300; display: none;
  }
  .error-msg.show { display: block; animation: slideIn 0.3s; }
  @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .reconnecting {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(255, 152, 0, 0.9);
    padding: 16px 20px; border-radius: 6px;
    font-size: 14px; z-index: 300; display: none;
  }
  .reconnecting.show { display: block; animation: pulse 1s infinite; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>

  <div class="control-bar">
    <div class="header">
      <div class="channel-info" id="channelName">IPTV</div>
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <div id="statusText">Listo</div>
      </div>
    </div>

    <div class="footer">
      <button class="btn play" id="playBtn">▶ PLAY</button>
      <button class="btn pause" id="pauseBtn">⏸ PAUSA</button>
      <button class="btn mute" id="muteBtn">🔊 SONIDO</button>
      <button class="btn fs" id="fsBtn">⛶ PANTALLA COMPLETA</button>
      <button class="btn channels" id="channelsBtn">📻 CANALES</button>
    </div>
  </div>

  <div class="channel-selector" id="channelSelector"></div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="reconnecting" id="reconnecting">Reconectando...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
(function() {
  const stage = document.getElementById('stage');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const channelName = document.getElementById('channelName');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const muteBtn = document.getElementById('muteBtn');
  const fsBtn = document.getElementById('fsBtn');
  const channelsBtn = document.getElementById('channelsBtn');
  const channelSelector = document.getElementById('channelSelector');
  const errorMsg = document.getElementById('errorMsg');
  const reconnecting = document.getElementById('reconnecting');

  let audioOnlyMode = false;
  let drawing = false;

  // LISTA FIJA DE CANALES
  const channels = [
    { name: 'Bufalo 5', url: 'https://bufaloweb.com/httpsCON/bufalo5/index.m3u8' },
    { name: 'RTVE 24H', url: 'https://rtvelivestream.akamaized.net/rtvesec/24h/24h_main_dvr.m3u8' }
  ];

  let currentIndex = 0;
  let hls = null;
  let reconnectAttempts = 0;
  const MAX_RECONNECT = 5;
  let reconnectTimeout = null;

  const HLS_CONFIG = {
    debug: false,
    autoStartLoad: true,
    startLevel: -1,
    maxBufferLength: 60,
    maxMaxBufferLength: 120,
    maxBufferSize: 60 * 1000 * 1000,
    maxLoadingDelay: 4,
    minAutoBitrate: 0,
    lowLatencyMode: false,
    enableWorker: true,
    workerPath: 'https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.worker.min.js',
    fragLoadingMaxRetry: 10,
    fragLoadingTimeOut: 30000,
    manifestLoadingMaxRetry: 10,
    manifestLoadingTimeOut: 30000,
    progressive: true,
  };

  // ---------- Canvas render loop ----------
  function resizeCanvas() {
    canvas.width = stage.clientWidth;
    canvas.height = stage.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('fullscreenchange', resizeCanvas);
  document.addEventListener('webkitfullscreenchange', resizeCanvas);
  resizeCanvas();

  function drawFrame() {
    if (!drawing) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const cw = canvas.width, ch = canvas.height;
      const vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.min(cw / vw, ch / vh);
      const dw = vw * scale, dh = vh * scale;
      const dx = (cw - dw) / 2, dy = (ch - dh) / 2;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(video, dx, dy, dw, dh);
    }
    requestAnimationFrame(drawFrame);
  }

  function startDrawing() {
    if (drawing) return;
    drawing = true;
    requestAnimationFrame(drawFrame);
  }

  function stopDrawing() { drawing = false; }

  // ---------- Helpers ----------
  function showError(msg, duration = 5000) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    setTimeout(() => errorMsg.classList.remove('show'), duration);
  }

  function updateStatus(text, isError = false) {
    statusText.textContent = text;
    statusDot.classList.toggle('error', isError);
  }

  function renderChannels() {
    channelSelector.innerHTML = '';
    channels.forEach((ch, i) => {
      const div = document.createElement('div');
      div.className = `channel-item ${i === currentIndex ? 'active' : ''}`;
      div.textContent = `${i + 1}. ${ch.name}`;
      div.onclick = () => {
        currentIndex = i;
        playChannel(i);
        channelSelector.classList.remove('show');
      };
      channelSelector.appendChild(div);
    });
  }

  function setupHLS(url) {
    if (hls) hls.destroy();
    stopDrawing();

    const isNativeHLS = video.canPlayType('application/vnd.apple.mpegurl');

    if (isNativeHLS) {
      video.src = url;
      updateStatus('Cargado');
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls(HLS_CONFIG);
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        updateStatus('Cargado');
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              updateStatus('Error red', true);
              showError('Problema de conexión. Reconectando...');
              attemptReconnect();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              updateStatus('Error codec', true);
              showError('Codec no soportado. Intenta otro canal.');
              break;
            default:
              updateStatus('Error', true);
              showError('Error desconocido');
              break;
          }
        }
      });

      hls.on(Hls.Events.BUFFER_APPENDING, () => { reconnectAttempts = 0; });
    } else {
      showError('HLS no soportado');
      updateStatus('Error', true);
    }
  }

  function playChannel(index) {
    const channel = channels[index];
    currentIndex = index;
    channelName.textContent = channel.name;
    updateStatus('Cargando...');
    reconnectAttempts = 0;
    setupHLS(channel.url);
    renderChannels();
  }

  function attemptReconnect() {
    if (reconnectAttempts >= MAX_RECONNECT) {
      updateStatus('Reconexión fallida', true);
      showError('No se puede reconectar. Intenta otro canal.');
      return;
    }
    reconnectAttempts++;
    reconnecting.classList.add('show');
    updateStatus(`Reconectando...`);
    clearTimeout(reconnectTimeout);
    reconnectTimeout = setTimeout(() => {
      playChannel(currentIndex);
      reconnecting.classList.remove('show');
    }, 3000 * reconnectAttempts);
  }

  // ---------- Sistema antipausa (se mantiene tal cual) ----------
  function forceContinuePlayback() {
    if (video.paused && !audioOnlyMode) {
      video.muted = false;
      video.play().then(startDrawing).catch(() => {});
    }
  }

  function antiPauseLoop() {
    forceContinuePlayback();
    requestAnimationFrame(antiPauseLoop);
  }

  setInterval(() => { forceContinuePlayback(); }, 500);

  // ---------- Controls ----------
  playBtn.onclick = () => {
    video.muted = false;
    muteBtn.textContent = '🔊 SONIDO ON';

    antiPauseLoop();

    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        updateStatus('Reproduciendo ▶ (SIN PAUSAS)');
        resizeCanvas();
        startDrawing();
      }).catch(e => {
        updateStatus('Error', true);
        showError('Error de reproducción');
      });
    }
  };

  pauseBtn.onclick = () => {
    video.pause();
    stopDrawing();
    updateStatus('Pausado');
  };

  muteBtn.onclick = () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇 SILENCIO' : '🔊 SONIDO';
    updateStatus(video.muted ? 'Silencio' : 'Sonido ON');
  };

  // Fullscreen sobre #stage (canvas + controles)
  fsBtn.onclick = () => {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs) {
      if (stage.requestFullscreen) stage.requestFullscreen();
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
      else showError('Este navegador no soporta pantalla completa.');
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  };

  channelsBtn.onclick = () => channelSelector.classList.toggle('show');

  video.addEventListener('playing', () => {
    updateStatus('Reproduciendo ▶');
    startDrawing();
  });

  // Si Tesla pausa, reiniciar inmediatamente (se mantiene igual)
  video.addEventListener('pause', () => {
    if (!audioOnlyMode && video.src) {
      setTimeout(() => {
        console.log('Tesla intentó pausar. Reiniciando...');
        video.muted = false;
        video.play().then(startDrawing).catch(() => {});
      }, 100);
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !video.paused && video.src) {
      video.play().then(startDrawing).catch(e => console.warn('Resume error:', e));
    }
  });

  window.addEventListener('online', () => updateStatus('Conectado'));
  window.addEventListener('offline', () => updateStatus('Sin conexión', true));

  video.controls = false;

  // Inicializar
  renderChannels();
  playChannel(0);
  updateStatus('Listo - Toca PLAY');
})();
</script>
</body>
</html>

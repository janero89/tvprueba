<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IPTV Tesla COPILOTO</title>
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  #videoContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 1;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  #renderCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    display: none;
    background: #000;
  }

  .control-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
    z-index: 100;
  }

  .header {
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
  }

  .channel-info {
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }

  .status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #4CAF50;
    box-shadow: 0 0 8px #4CAF50;
    animation: pulse 1.5s infinite;
  }

  .status-dot.error {
    background: #f44336;
    box-shadow: 0 0 8px #f44336;
  }

  .status-dot.driving {
    background: #FF9800;
    box-shadow: 0 0 8px #FF9800;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .footer {
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.9) 100%);
    padding: 20px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 110px;
    text-align: center;
  }

  .btn:hover {
    background: rgba(255,255,255,0.25);
    border-color: rgba(255,255,255,0.5);
  }

  .btn:active {
    background: rgba(255,255,255,0.35);
  }

  .btn.play { background: #4CAF50; border-color: #4CAF50; font-size: 18px; }
  .btn.play:hover { background: #66BB6A; }

  .btn.pause { background: #FF9800; border-color: #FF9800; }
  .btn.pause:hover { background: #FFB74D; }

  .btn.mute { background: #2196F3; border-color: #2196F3; }
  .btn.mute:hover { background: #42A5F5; }

  .btn.channels { background: #673AB7; border-color: #673AB7; }
  .btn.channels:hover { background: #7E57C2; }

  .channel-selector {
    position: fixed;
    bottom: 100px;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.97);
    border-top: 3px solid #4CAF50;
    max-height: 250px;
    overflow-y: auto;
    pointer-events: auto;
    display: none;
    z-index: 50;
  }

  .channel-selector.show {
    display: block;
  }

  .channel-item {
    padding: 18px 24px;
    border-bottom: 1px solid #222;
    cursor: pointer;
    font-size: 18px;
    transition: background 0.2s;
  }

  .channel-item:hover {
    background: rgba(76, 175, 80, 0.2);
  }

  .channel-item.active {
    background: rgba(76, 175, 80, 0.4);
    border-left: 5px solid #4CAF50;
    padding-left: 19px;
    font-weight: bold;
  }

  .error-msg {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(244, 67, 54, 0.9);
    padding: 16px 20px;
    border-radius: 6px;
    font-size: 14px;
    max-width: 400px;
    z-index: 300;
    display: none;
  }

  .error-msg.show {
    display: block;
    animation: slideIn 0.3s;
  }

  @keyframes slideIn {
    from { transform: translateX(-100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .debug-log {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.8);
    color: #0f0;
    font-family: monospace;
    font-size: 11px;
    padding: 10px;
    border-radius: 4px;
    max-width: 300px;
    max-height: 150px;
    overflow-y: auto;
    z-index: 200;
    display: none;
    border: 1px solid #0f0;
  }

  .debug-log.show {
    display: block;
  }

  .debug-log div {
    margin: 2px 0;
  }

  .driving-indicator {
    position: fixed;
    top: 100px;
    right: 20px;
    background: rgba(255, 152, 0, 0.9);
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    z-index: 200;
    display: none;
    border: 2px solid #FF9800;
  }

  .driving-indicator.show {
    display: block;
  }
</style>
</head>
<body>

<div id="videoContainer">
  <video id="video" playsinline muted autoplay crossorigin="anonymous"></video>
</div>

<canvas id="renderCanvas"></canvas>

<div class="control-bar">
  <div class="header">
    <div class="channel-info" id="channelName">IPTV COPILOTO</div>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <div id="statusText">Listo</div>
    </div>
  </div>

  <div class="footer">
    <button class="btn play" id="playBtn">▶ PLAY</button>
    <button class="btn pause" id="pauseBtn">⏸ PAUSA</button>
    <button class="btn mute" id="muteBtn">🔊 SONIDO</button>
    <button class="btn channels" id="channelsBtn">📻 CANALES</button>
  </div>
</div>

<div class="channel-selector" id="channelSelector"></div>
<div class="error-msg" id="errorMsg"></div>
<div class="driving-indicator" id="drivingIndicator">🚗 MODO CONDUCCIÓN - Canvas Activo</div>
<div class="debug-log" id="debugLog"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
(function() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('renderCanvas');
  const ctx = canvas && canvas.getContext('2d');
  const channelName = document.getElementById('channelName');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const muteBtn = document.getElementById('muteBtn');
  const channelsBtn = document.getElementById('channelsBtn');
  const channelSelector = document.getElementById('channelSelector');
  const errorMsg = document.getElementById('errorMsg');
  const debugLog = document.getElementById('debugLog');
  const drivingIndicator = document.getElementById('drivingIndicator');

  let debugMessages = [];

  function debug(msg) {
    const timestamp = new Date().toLocaleTimeString();
    const logMsg = `[${timestamp}] ${msg}`;
    debugMessages.push(msg);
    if (debugMessages.length > 20) debugMessages.shift();

    debugLog.innerHTML = debugMessages.map(m => `<div>${m}</div>`).join('');
  }

  function showError(msg, duration = 5000) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    debug(`❌ ${msg}`);
    setTimeout(() => errorMsg.classList.remove('show'), duration);
  }

  function updateStatus(text, isError = false, isDriving = false) {
    statusText.textContent = text;
    statusDot.classList.toggle('error', isError);
    statusDot.classList.toggle('driving', isDriving);
    debug(`📊 ${text}`);
  }

  // LISTA FIJA DE CANALES
  const channels = [
    { name: 'Bufalo 5', url: 'https://bufaloweb.com/httpsCON/bufalo5/index.m3u8' },
    { name: 'RTVE 24H', url: 'https://rtvelivestream.akamaized.net/rtvesec/24h/24h_main_dvr.m3u8' }
  ];

  let currentIndex = 0;
  let hls = null;
  let lastCurrentTime = 0;
  let stallCount = 0;
  let isPlaying = false;
  let isDriving = false;
  let useCanvasMode = false;
  let animationFrameId = null;
  let mainLoopId = null;

  const HLS_CONFIG = {
    debug: false,
    autoStartLoad: true,
    startLevel: -1,
    maxBufferLength: 60,
    maxMaxBufferLength: 120,
    fragLoadingMaxRetry: 10,
    fragLoadingTimeOut: 30000,
    manifestLoadingMaxRetry: 10,
    manifestLoadingTimeOut: 30000,
  };

  function renderChannels() {
    channelSelector.innerHTML = '';
    channels.forEach((ch, i) => {
      const div = document.createElement('div');
      div.className = `channel-item ${i === currentIndex ? 'active' : ''}`;
      div.textContent = `${i + 1}. ${ch.name}`;
      div.onclick = () => {
        currentIndex = i;
        playChannel(i);
        channelSelector.classList.remove('show');
      };
      channelSelector.appendChild(div);
    });
  }

  function setupHLS(url) {
    if (hls) hls.destroy();

    const isNativeHLS = video.canPlayType('application/vnd.apple.mpegurl');

    if (isNativeHLS) {
      video.src = url;
      updateStatus('Cargado');
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls(HLS_CONFIG);
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        updateStatus('Cargado');
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          updateStatus('Error', true);
          showError('Error en stream');
        }
      });
    }
  }

  function playChannel(index) {
    currentIndex = index;
    const channel = channels[index];
    channelName.textContent = channel.name;
    updateStatus('Cargando...');
    setupHLS(channel.url);
    renderChannels();
  }

  // ==================== DETECCIÓN DE MODO CONDUCCIÓN ====================

  function detectDrivingMode() {
    debug('✅ Sistema de detección de conducción activado');

    // Monitorear si el video se pausa forzadamente (pausa por Tesla)
    video.addEventListener('pause', (e) => {
      if (isPlaying && video.src && video.paused && !isDriving) {
        debug('🚗 CONDUCCIÓN DETECTADA - Video pausado por Tesla');
        isDriving = true;
        switchToCanvasMode();
        updateStatus('🎬 COPILOTO - Canvas Activo', false, true);
        drivingIndicator.classList.add('show');
      }
    }, true);

    // Monitorear intentos de reproducción (cuando vuelve a estar aparcado)
    video.addEventListener('playing', (e) => {
      if (isDriving && useCanvasMode) {
        debug('🅿️ APARCADO - Video volvió a reproducirse normalmente');
        isDriving = false;
        switchToVideoMode();
        updateStatus('🎬 Reproduciendo', false, false);
        drivingIndicator.classList.remove('show');
      }
    }, true);
  }

  // ==================== CANVAS RENDERING MODE ====================

  function switchToCanvasMode() {
    if (useCanvasMode) return;

    useCanvasMode = true;
    debug('📺 Iniciando renderizado en Canvas');

    // Ocultar video elemento
    document.getElementById('videoContainer').style.display = 'none';

    // Mostrar canvas
    canvas.style.display = 'block';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Audio sigue funcionando desde el video (que está oculto pero reproduce)
    video.muted = false;
    video.volume = 1;

    // Forzar play del video oculto
    setTimeout(() => {
      video.play().catch((err) => {
        debug('⚠️ Error en play: ' + err.message);
      });
    }, 50);

    // Iniciar loop de renderizado
    canvasRenderLoop();
  }

  function switchToVideoMode() {
    useCanvasMode = false;
    debug('📺 Volviendo a modo video');

    // Mostrar video
    document.getElementById('videoContainer').style.display = 'block';
    canvas.style.display = 'none';

    if (animationFrameId) {
      cancelAnimationFrame(animationFrameId);
      animationFrameId = null;
    }
  }

  function canvasRenderLoop() {
    if (!useCanvasMode) return;

    try {
      // Limpiar canvas
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dibujar frame actual del video en el canvas
      if (!video.paused && video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }

      // Mostrar info en canvas
      ctx.fillStyle = 'rgba(76, 175, 80, 0.8)';
      ctx.font = 'bold 16px Arial';
      ctx.fillText(`▶ ${video.currentTime.toFixed(1)}s`, 20, 40);

      // Si video está pausado en canvas, intentar reproducir
      if (video.paused) {
        video.play().catch(() => {});
      }

      animationFrameId = requestAnimationFrame(canvasRenderLoop);
    } catch (e) {
      debug(`❌ Canvas Error: ${e.message}`);
    }
  }

  // ==================== FORZAR PLAY AGRESIVO ====================

  function aggressivePlay() {
    if (!isPlaying || !video.src) return;

    debug('🔄 Aggressive play iniciado (10 intentos)');

    // Intentos múltiples de play
    for (let i = 0; i < 10; i++) {
      setTimeout(() => {
        video.muted = false;
        video.volume = 1;
        video.play().catch(() => {});
      }, i * 50);
    }
  }

  // ==================== LOOP PRINCIPAL ====================

  function startMainLoop() {
    if (mainLoopId) clearInterval(mainLoopId);

    mainLoopId = setInterval(() => {
      if (isPlaying) {
        // Si está en modo conducción y canvas activo, asegurarse que video siga reproduciéndose
        if (isDriving && useCanvasMode && video.paused) {
          debug('🔧 Reintentando play en modo canvas...');
          video.muted = false;
          video.volume = 1;
          video.play().catch(() => {});
        }

        // Detectar stalls
        if (video.currentTime === lastCurrentTime && video.duration > 0 && !video.paused) {
          stallCount++;
          if (stallCount > 3) {
            debug(`⚡ Stall detectado (${stallCount}x), saltando...`);
            video.currentTime = Math.min(video.currentTime + 1, video.duration - 1);
            video.play().catch(() => {});
            stallCount = 0;
          }
        } else {
          stallCount = 0;
        }

        lastCurrentTime = video.currentTime;
      }
    }, 100);
  }

  // ==================== EVENT LISTENERS ====================

  playBtn.onclick = () => {
    isPlaying = true;
    video.muted = false;
    muteBtn.textContent = '🔊 SONIDO ON';

    updateStatus('🎬 REPRODUCIENDO');
    debug('✅ Playback iniciado');

    aggressivePlay();
    startMainLoop();

    // Intentar fullscreen
    if (video.requestFullscreen) {
      video.requestFullscreen().catch(() => {});
    }
  };

  pauseBtn.onclick = () => {
    isPlaying = false;
    useCanvasMode = false;
    isDriving = false;

    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    if (mainLoopId) clearInterval(mainLoopId);

    document.getElementById('videoContainer').style.display = 'block';
    canvas.style.display = 'none';

    video.pause();
    updateStatus('Pausado');
    drivingIndicator.classList.remove('show');
  };

  muteBtn.onclick = () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇 SILENCIO' : '🔊 SONIDO';
  };

  channelsBtn.onclick = () => {
    channelSelector.classList.toggle('show');
  };

  // Toggle debug log
  document.addEventListener('keydown', (e) => {
    if (e.key === 'd' || e.key === 'D') {
      debugLog.classList.toggle('show');
    }
  });

  // Resize canvas on window resize
  window.addEventListener('resize', () => {
    if (useCanvasMode) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
  });

  // Limpiar resources al salir
  window.addEventListener('beforeunload', () => {
    if (hls) hls.destroy();
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    if (mainLoopId) clearInterval(mainLoopId);
  });

  // ==================== INICIALIZAR ====================

  renderChannels();
  playChannel(0);
  detectDrivingMode();
  updateStatus('Listo - Presiona PLAY');
  debug(`🚀 Sistema COPILOTO TESLA cargado`);
})();
</script>
</body>
</html>
